events { worker_connections 2048; }
http {
include /etc/nginx/mime.types;
default_type application/octet-stream;
sendfile on;
tcp_nopush on;
tcp_nodelay on;
keepalive_timeout 65;
server_tokens off;
      client_max_body_size 4m;
gzip on;
      gzip_vary on;
      gzip_comp_level 5;
      gzip_min_length 256;
      gzip_types text/plain text/css text/xml text/javascript
  application/javascript application/json image/svg+xml font/woff2;

      # Redirect HTTP → HTTPS
      server {
          listen 80;
          server_name aquavirdb.com www.aquavirdb.com;

          # Let's Encrypt HTTP-01 challenge (webroot); served before the 301 redirect
          location ^~ /.well-known/acme-challenge/ {
              root /usr/share/nginx/html;
              default_type text/plain;
          }

          location / {
              return 301 https://$host$request_uri;
          }
      }

      server {
          listen 443 ssl;
          server_name aquavirdb.com www.aquavirdb.com;

          ssl_certificate /etc/nginx/certs/fullchain.pem;
          ssl_certificate_key /etc/nginx/certs/privkey.pem;

          add_header Strict-Transport-Security "max-age=63072000" always;
          add_header X-Content-Type-Options "nosniff" always;
          add_header X-Frame-Options "SAMEORIGIN" always;

          root /usr/share/nginx/html;
          index index.html;

          location /static/vendor/ {
              alias /usr/share/nginx/html/vendor/;
              expires 1y;
              add_header Cache-Control "public, immutable";
          }

          location /api/ {
              proxy_pass http://api:8000;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_read_timeout 120s;
          }

          location = /docs {
              proxy_pass http://api:8000/docs;
              proxy_set_header Host $host;
              proxy_set_header X-Forwarded-Proto $scheme;
          }

          location = /redoc {
              proxy_pass http://api:8000/redoc;
              proxy_set_header Host $host;
              proxy_set_header X-Forwarded-Proto $scheme;
          }

          location = /openapi.json {
              proxy_pass http://api:8000/openapi.json;
              proxy_set_header Host $host;
          }

          location / {
              try_files $uri $uri.html @api;
          }

          location @api {
              proxy_pass http://api:8000;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
          }
      }
  }
