version: '3.8'

services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    volumes:
      - ../backend.py:/app/backend.py:ro
      - ../api_models.py:/app/api_models.py:ro
      - ../db_utils.py:/app/db_utils.py:ro
      - ../templates:/app/templates:ro
      - ../public_assets:/app/public_assets:ro
      - ./data/crustacean_virus_core.db:/app/crustacean_virus_core.db:rw
      - ./data/sequences:/app/sequences:rw
      - ./data/blastdb:/app/blastdb:rw
      - ./data/public_downloads:/app/public_downloads:ro
    expose:
      - "8000"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/usr/share/nginx/html:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  ssl_certs:
  certbot_www:
